<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movie Admin - Movies</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            color: #222;
        }

        .navbar {
            background: #1f2937;
            color: white;
            padding: 20px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .back {
            color: white;
            text-decoration: none;
            background: #374151;
            padding: 10px 18px;
            border-radius: 6px;
        }

        .container {
            padding: 40px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0;
        }

        .add {
            background: #2563eb;
            color: white;

            text-decoration: none;

            padding: 11px 20px;
            border-radius: 6px;
        }

        .movies {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .movie {
            background: white;

            border-radius: 10px;

            overflow: hidden;

            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .movie img {
            width: 100%;
            height: 300px;

            object-fit: cover;

            display: block;
        }

        .movie-info {
            padding: 15px;
        }

        .movie-title {
            font-size: 18px;
            font-weight: bold;

            margin-bottom: 10px;
        }

        .movie-rating {
            color: #666;
            margin-bottom: 15px;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .actions button {
            flex: 1;

            padding: 9px;

            border: none;
            border-radius: 6px;

            cursor: pointer;

            font-size: 14px;
        }

        .edit {
            background: #e5e7eb;
            color: #222;
        }

        .delete {
            background: #ef4444;
            color: white;
        }

        @media (max-width: 1000px) {

            .movies {
                grid-template-columns: repeat(3, 1fr);
            }

        }

        @media (max-width: 700px) {

            .movies {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 500px) {

            .movies {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 20px;
            }

        }
    </style>
</head>

<body>

    <div class="navbar">

        <h2>Movie Admin</h2>

        <a href="dashboard.html" class="back">
            Dashboard
        </a>

    </div>


    <div class="container">

        <div class="header">

            <h1>Movies</h1>

            <a href="add-movie.html" class="add">
                + Add Movie
            </a>

        </div>


        <div class="movies" id="movies">

        </div>

    </div>


    <script>

        const accessToken = localStorage.getItem("access_token");


        async function loadMovies() {

            const response = await fetch(
                "http://127.0.0.1:8000/content/movies/",
                {
                    headers: {
                        "Authorization": `Bearer ${accessToken}`
                    }
                }
            );


            if (!response.ok) {

                console.log("Failed to load movies");

                return;
            }


            const data = await response.json();


            const movies = Array.isArray(data)
                ? data
                : data.results;


            const container = document.getElementById("movies");


            container.innerHTML = "";


            movies.forEach(movie => {


                const card = document.createElement("div");

                card.className = "movie";


                card.innerHTML = `

                    <img
                        src="${movie.poster_url}"
                        alt="${movie.title}"
                    >

                    <div class="movie-info">

                        <div class="movie-title">
                            ${movie.title}
                        </div>

                        <div class="movie-rating">
                            ⭐ ${movie.imdb_rating ?? "N/A"}
                        </div>

                        <div class="actions">

                            <button
                                class="edit"
                                onclick="editMovie(${movie.id})"
                            >
                                Edit
                            </button>

                            <button
                                class="delete"
                                onclick="deleteMovie(${movie.id})"
                            >
                                Delete
                            </button>

                        </div>

                    </div>

                `;


                container.appendChild(card);

            });

        }


        function editMovie(movieId) {

            window.location.href = `edit-movie.html?id=${movieId}`;

        }


        async function deleteMovie(movieId) {

            const confirmDelete = confirm(
                "Are you sure you want to delete this movie?"
            );

            if (!confirmDelete) {
                return;
            }

            const response = await fetch(
                `http://127.0.0.1:8000/content/movies/${movieId}/`,
                {
                    method: "DELETE",

                    headers: {
                        "Authorization": `Bearer ${accessToken}`
                    }
                }
            );

            if (response.ok) {

                alert("Movie deleted successfully.");

                loadMovies();

            } else {

                alert("Failed to delete movie.");

    }

}


        loadMovies();

    </script>

</body>
</html>
