<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Folder</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            color: #222;
        }

        .navbar {
            background: #1f2937;
            color: white;

            padding: 20px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .back {
            color: white;
            text-decoration: none;

            background: #374151;

            padding: 10px 18px;

            border-radius: 6px;
        }

        .container {
            max-width: 700px;

            margin: 40px auto;

            padding: 30px;

            background: white;

            border-radius: 10px;

            box-shadow:
                0 3px 10px
                rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 11px;

            border: 1px solid #d1d5db;

            border-radius: 6px;

            font-size: 15px;
        }

        .actions {
            display: flex;

            gap: 10px;

            margin-top: 30px;
        }

        .save {
            background: #2563eb;

            color: white;

            border: none;

            border-radius: 6px;

            padding: 12px 25px;

            cursor: pointer;
        }

        .cancel {
            background: #e5e7eb;

            color: #222;

            text-decoration: none;

            padding: 12px 25px;

            border-radius: 6px;
        }

    </style>

</head>

<body>


<div class="navbar">

    <h2>Movie Admin</h2>

    <a
        href="folders.html"
        class="back"
    >
        Folders
    </a>

</div>


<div class="container">

    <h1>Add Folder</h1>


    <form id="folderForm">

        <div class="form-group">

            <label for="title">
                Folder Title
            </label>

            <input
                type="text"
                id="title"
                required
            >

        </div>


        <div class="actions">

            <button
                type="submit"
                class="save"
            >
                Create Folder
            </button>

            <a
                href="folders.html"
                class="cancel"
            >
                Cancel
            </a>

        </div>

    </form>

</div>


<script>

const accessToken =
    localStorage.getItem("access_token");


document.getElementById(
    "folderForm"
).addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const title =
            document.getElementById(
                "title"
            ).value;


        const response =
            await fetch(
                "http://127.0.0.1:8000/special/folders/",
                {
                    method: "POST",

                    headers: {
                        "Authorization":
                            `Bearer ${accessToken}`,

                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            title: title
                        })
                }
            );


        if (!response.ok) {

            const error =
                await response.json();

            console.log(
                "FOLDER ERROR:",
                error
            );

            alert(
                "Failed to create folder."
            );

            return;

        }


        alert(
            "Folder created successfully."
        );


        window.location.href =
            "folders.html";

    }
);

</script>

</body>
</html>
