<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Folder</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background: #f5f6fa;

            color: #222;
        }

        .navbar {
            background: #1f2937;

            color: white;

            padding: 20px 40px;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .back {
            color: white;

            text-decoration: none;

            background: #374151;

            padding: 10px 18px;

            border-radius: 6px;
        }

        .container {
            max-width: 1000px;

            margin: 40px auto;

            padding: 30px;

            background: white;

            border-radius: 10px;

            box-shadow:
                0 3px 10px
                rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;

            margin-bottom: 30px;
        }

        h2 {
            margin-top: 40px;

            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-weight: bold;
        }

        input,
        select {
            width: 100%;

            padding: 11px;

            border: 1px solid #d1d5db;

            border-radius: 6px;

            font-size: 15px;
        }

        .items-container {
            display: flex;

            flex-direction: column;

            gap: 15px;
        }

        .item-row {
            display: grid;

            grid-template-columns:
                1fr 1fr auto;

            gap: 10px;

            align-items: end;

            padding: 15px;

            border: 1px solid #ddd;

            border-radius: 8px;

            background: #fafafa;
        }

        .add-btn {
            background: #2563eb;

            color: white;

            border: none;

            border-radius: 6px;

            padding: 11px 20px;

            cursor: pointer;

            margin-top: 15px;
        }

        .remove-btn {
            background: #ef4444;

            color: white;

            border: none;

            border-radius: 6px;

            padding: 10px 15px;

            cursor: pointer;
        }

        .actions {
            display: flex;

            gap: 10px;

            margin-top: 40px;
        }

        .save {
            background: #2563eb;

            color: white;

            border: none;

            border-radius: 6px;

            padding: 12px 25px;

            cursor: pointer;
        }

        .cancel {
            background: #e5e7eb;

            color: #222;

            text-decoration: none;

            padding: 12px 25px;

            border-radius: 6px;
        }

        @media (max-width: 700px) {

            .container {
                margin: 20px;
            }

            .item-row {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>


<div class="navbar">

    <h2>Movie Admin</h2>

    <a
        href="folders.html"
        class="back"
    >
        Folders
    </a>

</div>


<div class="container">

    <h1>Edit Folder</h1>


    <form id="folderForm">


        <div class="form-group">

            <label for="title">
                Folder Title
            </label>

            <input
                type="text"
                id="title"
                required
            >

        </div>


        <h2>Folder Items</h2>


        <div
            id="items-container"
            class="items-container"
        ></div>


        <button
            type="button"
            class="add-btn"
            onclick="addItemRow()"
        >
            + Add Item
        </button>


        <div class="actions">

            <button
                type="submit"
                class="save"
            >
                Save Changes
            </button>

            <a
                href="folders.html"
                class="cancel"
            >
                Cancel
            </a>

        </div>


    </form>

</div>


<script>

const accessToken =
    localStorage.getItem("access_token");


const params =
    new URLSearchParams(
        window.location.search
    );


const folderId =
    params.get("id");


let movies = [];

let series = [];


/* ----------------------------------------
   LOAD OPTIONS
---------------------------------------- */


async function loadOptions(url) {

    const response =
        await fetch(
            `http://127.0.0.1:8000${url}`,
            {
                headers: {
                    "Authorization":
                        `Bearer ${accessToken}`
                }
            }
        );


    if (!response.ok) {

        console.log(
            "Failed to load:",
            url
        );

        return [];

    }


    const data =
        await response.json();


    return Array.isArray(data)
        ? data
        : data.results;

}


/* ----------------------------------------
   LOAD MOVIES
---------------------------------------- */


async function loadMovies() {

    movies =
        await loadOptions(
            "/content/movies/"
        );

}


/* ----------------------------------------
   LOAD SERIES
---------------------------------------- */


async function loadSeries() {

    series =
        await loadOptions(
            "/content/series/"
        );

}


/* ----------------------------------------
   LOAD FOLDER
---------------------------------------- */


async function loadFolder() {

    console.log("FOLDER ID:", folderId);

    const response =
        await fetch(
            `http://127.0.0.1:8000/special/folders/${folderId}/`,
            {
                method: "GET",

                headers: {
                    "Authorization":
                        `Bearer ${accessToken}`
                }
            }
        );


    console.log(
        "FOLDER STATUS:",
        response.status
    );


    if (!response.ok) {

        console.log(
            "FOLDER ERROR:",
            await response.text()
        );

        alert(
            "Failed to load folder."
        );

        return;

    }


    const folder =
        await response.json();


    console.log(
        "FOLDER DATA:",
        folder
    );


    document.getElementById(
        "title"
    ).value =
        folder.title || "";


    await loadItems();

}

/* ----------------------------------------
   LOAD ITEMS
---------------------------------------- */


async function loadItems() {

    const response =
        await fetch(
            `http://127.0.0.1:8000/special/folder-item/?folder=${folderId}`,
            {
                headers: {
                    "Authorization":
                        `Bearer ${accessToken}`
                }
            }
        );


    if (!response.ok) {

        console.log(
            "Failed to load folder items."
        );

        return;

    }


    const data =
        await response.json();


    const items =
        Array.isArray(data)
            ? data
            : data.results;


    const container =
        document.getElementById(
            "items-container"
        );


    container.innerHTML = "";


    items.forEach(item => {

        addItemRow(item);

    });

}


/* ----------------------------------------
   ADD ITEM ROW
---------------------------------------- */


function addItemRow(item = null) {

    const container =
        document.getElementById(
            "items-container"
        );


    const row =
        document.createElement("div");


    row.className =
        "item-row";


    if (item) {

        row.dataset.itemId =
            String(item.id);

    } else {

        row.dataset.itemId = "";

    }


    let movieOptions =
        `<option value="">Select Movie</option>`;


    movies.forEach(movie => {

        movieOptions += `

            <option
                value="${movie.id}"
                ${
                    item &&
                    item.movie !== null &&
                    Number(item.movie) === Number(movie.id)
                        ? "selected"
                        : ""
                }
            >
                ${movie.title}
            </option>

        `;

    });


    let seriesOptions =
        `<option value="">Select Series</option>`;


    series.forEach(serie => {

        seriesOptions += `

            <option
                value="${serie.id}"
                ${
                    item &&
                    item.series !== null &&
                    Number(item.series) === Number(serie.id)
                        ? "selected"
                        : ""
                }
            >
                ${serie.title}
            </option>

        `;

    });


    row.innerHTML = `

        <div>

            <label>
                Movie
            </label>

            <select class="movie-select">

                ${movieOptions}

            </select>

        </div>


        <div>

            <label>
                Series
            </label>

            <select class="series-select">

                ${seriesOptions}

            </select>

        </div>


        <button
            type="button"
            class="remove-btn"
            onclick="removeItemRow(this)"
        >
            Remove
        </button>

    `;


    container.appendChild(row);


    console.log(
        "ITEM ROW:",
        row.dataset.itemId,
        item
    );

}

/* ----------------------------------------
   REMOVE ITEM
---------------------------------------- */


async function removeItemRow(button) {

    const row =
        button.parentElement;


    const itemId =
        row.dataset.itemId;


    if (itemId) {

        const response =
            await fetch(
                `http://127.0.0.1:8000/special/folder-item/${itemId}/`,
                {
                    method: "DELETE",

                    headers: {
                        "Authorization":
                            `Bearer ${accessToken}`
                    }
                }
            );


        if (!response.ok) {

            alert(
                "Failed to remove item."
            );

            return;

        }

    }


    row.remove();

}


/* ----------------------------------------
   SAVE
---------------------------------------- */


document.getElementById(
    "folderForm"
).addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const title =
            document.getElementById(
                "title"
            ).value;


        /* UPDATE FOLDER */


        const folderResponse =
            await fetch(
                `http://127.0.0.1:8000/special/folders/${folderId}/`,
                {
                    method: "PATCH",

                    headers: {
                        "Authorization":
                            `Bearer ${accessToken}`,

                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            title: title
                        })
                }
            );


        if (!folderResponse.ok) {

            console.log(
                "FOLDER ERROR:",
                await folderResponse.json()
            );

            alert(
                "Failed to update folder."
            );

            return;

        }


        /* SAVE ITEMS */


        const itemRows =
            document.querySelectorAll(
                ".item-row"
            );


        for (
            const row
            of itemRows
        ) {

            const itemId =
                row.dataset.itemId || "";
                console.log(
                        "SAVING ITEM:",
                        itemId
                    );


            const movie =
                row.querySelector(
                    ".movie-select"
                ).value;


            const serie =
                row.querySelector(
                    ".series-select"
                ).value;


            if (
                (!movie && !serie) ||
                (movie && serie)
            ) {

                continue;

            }


            const itemData = {

                folder:
                    Number(folderId),

                movie:
                    movie
                        ? Number(movie)
                        : null,

                series:
                    serie
                        ? Number(serie)
                        : null

            };


            let response;


            if (itemId) {

                response =
                    await fetch(
                        `http://127.0.0.1:8000/special/folder-item/${itemId}/`,
                        {
                            method: "PATCH",

                            headers: {
                                "Authorization":
                                    `Bearer ${accessToken}`,

                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(
                                    itemData
                                )
                        }
                    );

            } else {

                response =
                    await fetch(
                        "http://127.0.0.1:8000/special/folder-item/",
                        {
                            method: "POST",

                            headers: {
                                "Authorization":
                                    `Bearer ${accessToken}`,

                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(
                                    itemData
                                )
                        }
                    );

            }


            if (!response.ok) {

                console.log(
                    "ITEM ERROR:",
                    await response.json()
                );

                alert(
                    "Some folder items could not be saved."
                );

                return;

            }

        }


        alert(
            "Folder updated successfully."
        );


        window.location.href =
            "folders.html";

    }
);


/* ----------------------------------------
   INIT
---------------------------------------- */


async function init() {

    await loadMovies();

    await loadSeries();

    await loadFolder();

}


init();

</script>

</body>
</html>
