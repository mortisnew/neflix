<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>People</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            color: #222;
        }

        .navbar {
            background: #1f2937;
            color: white;
            padding: 20px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 30px;

            background: white;
            border-radius: 10px;

            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 30px;
        }

        h1 {
            margin: 0;
        }

        .add-btn {
            background: #2563eb;
            color: white;

            text-decoration: none;

            padding: 11px 20px;

            border-radius: 6px;
        }

        .people-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .person-card {
            display: flex;
            align-items: center;
            gap: 20px;

            padding: 20px;

            border: 1px solid #ddd;
            border-radius: 8px;

            background: #fafafa;
        }

        .avatar {
            width: 80px;
            height: 80px;

            border-radius: 50%;

            object-fit: cover;

            background: #ddd;
        }

        .person-info {
            flex: 1;
        }

        .person-info h3 {
            margin: 0 0 8px;
        }

        .person-info p {
            margin: 0;

            color: #666;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .edit-btn,
        .delete-btn {
            border: none;
            border-radius: 6px;

            padding: 10px 15px;

            cursor: pointer;

            text-decoration: none;

            color: white;
        }

        .edit-btn {
            background: #2563eb;
        }

        .delete-btn {
            background: #ef4444;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #777;
        }

        @media (max-width: 700px) {

            .container {
                margin: 20px;
            }

            .top-bar {
                align-items: flex-start;
                gap: 15px;
                flex-direction: column;
            }

            .person-card {
                flex-direction: column;
                align-items: flex-start;
            }

            .actions {
                width: 100%;
            }

        }
    </style>
</head>

<body>

<div class="navbar">

    <h2>Movie Admin</h2>

</div>


<div class="container">

    <div class="top-bar">

        <h1>People</h1>

        <a
            href="add-people.html"
            class="add-btn"
        >
            + Add Person
        </a>

    </div>


    <div
        id="people-container"
        class="people-container"
    ></div>

</div>


<script>

const accessToken =
    localStorage.getItem("access_token");


async function loadPeople() {

    const response =
        await fetch(
            "http://127.0.0.1:8000/people/people/",
            {
                headers: {
                    "Authorization":
                        `Bearer ${accessToken}`
                }
            }
        );


    if (!response.ok) {

        alert("Failed to load people.");

        return;

    }


    const data =
        await response.json();


    const people =
        Array.isArray(data)
            ? data
            : data.results;


    const container =
        document.getElementById(
            "people-container"
        );


    container.innerHTML = "";


    if (!people || people.length === 0) {

        container.innerHTML = `
            <div class="empty">
                No people found.
            </div>
        `;

        return;

    }


    people.forEach(person => {

        const card =
            document.createElement("div");


        card.className =
            "person-card";


        card.innerHTML = `

            <img
                class="avatar"
                src="${person.avatar_url}"
                alt="${person.full_name}"
                onerror="this.style.display='none'"
            >

            <div class="person-info">

                <h3>
                    ${person.full_name}
                </h3>

                <p>
                    ${
                        person.bio
                            ? person.bio
                            : "No biography."
                    }
                </p>

            </div>


            <div class="actions">

                <a
                    href="edit-people.html?id=${person.id}"
                    class="edit-btn"
                >
                    Edit
                </a>


                <button
                    class="delete-btn"
                    onclick="deletePerson(${person.id})"
                >
                    Delete
                </button>

            </div>

        `;


        container.appendChild(card);

    });

}


async function deletePerson(id) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this person?"
        );


    if (!confirmed) {

        return;

    }


    const response =
        await fetch(
            `http://127.0.0.1:8000/people/people/${id}/`,
            {
                method: "DELETE",

                headers: {
                    "Authorization":
                        `Bearer ${accessToken}`
                }
            }
        );


    if (!response.ok) {

        alert(
            "Failed to delete person."
        );

        return;

    }


    loadPeople();

}


loadPeople();

</script>

</body>
</html>
