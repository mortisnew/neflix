<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Folders</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            color: #222;
        }

        .navbar {
            background: #1f2937;
            color: white;
            padding: 20px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .back {
            color: white;
            text-decoration: none;
            background: #374151;
            padding: 10px 18px;
            border-radius: 6px;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 30px;

            background: white;
            border-radius: 10px;

            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 30px;
        }

        h1 {
            margin: 0;
        }

        .add-btn {
            background: #2563eb;
            color: white;
            text-decoration: none;

            padding: 11px 20px;
            border-radius: 6px;
        }

        .folders-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .folder-card {
            display: flex;
            align-items: center;
            gap: 20px;

            padding: 20px;

            border: 1px solid #ddd;
            border-radius: 8px;

            background: #fafafa;
        }

        .folder-icon {
            font-size: 40px;
        }

        .folder-info {
            flex: 1;
        }

        .folder-info h3 {
            margin: 0;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .edit-btn,
        .delete-btn {
            border: none;
            border-radius: 6px;

            padding: 10px 15px;

            cursor: pointer;
            text-decoration: none;

            color: white;
        }

        .edit-btn {
            background: #2563eb;
        }

        .delete-btn {
            background: #ef4444;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #777;
        }

        @media (max-width: 700px) {

            .container {
                margin: 20px;
            }

            .top-bar {
                align-items: flex-start;
                gap: 15px;
                flex-direction: column;
            }

            .folder-card {
                flex-direction: column;
                align-items: flex-start;
            }

        }

    </style>
</head>

<body>

<div class="navbar">

    <h2>Movie Admin</h2>

    <a
        href="dashboard.html"
        class="back"
    >
        Dashboard
    </a>

</div>


<div class="container">

    <div class="top-bar">

        <h1>Folders</h1>

        <a
            href="add-folder.html"
            class="add-btn"
        >
            + Add Folder
        </a>

    </div>


    <div
        id="folders-container"
        class="folders-container"
    ></div>

</div>


<script>

const accessToken =
    localStorage.getItem("access_token");


async function loadFolders() {

    const response =
        await fetch(
            "http://127.0.0.1:8000/special/folders/",
            {
                headers: {
                    "Authorization":
                        `Bearer ${accessToken}`
                }
            }
        );


    if (!response.ok) {

        alert("Failed to load folders.");

        return;

    }


    const data =
        await response.json();


    const folders =
        Array.isArray(data)
            ? data
            : data.results;


    const container =
        document.getElementById(
            "folders-container"
        );


    container.innerHTML = "";


    if (!folders || folders.length === 0) {

        container.innerHTML = `
            <div class="empty">
                No folders found.
            </div>
        `;

        return;

    }


    folders.forEach(folder => {

        const card =
            document.createElement("div");


        card.className =
            "folder-card";


        card.innerHTML = `

            <div class="folder-icon">
                📁
            </div>

            <div class="folder-info">

                <h3>
                    ${folder.title}
                </h3>

            </div>


            <div class="actions">

                <a
                    href="edit-folder.html?id=${folder.id}"
                    class="edit-btn"
                >
                    Edit
                </a>


                <button
                    class="delete-btn"
                    onclick="deleteFolder(${folder.id})"
                >
                    Delete
                </button>

            </div>

        `;


        container.appendChild(card);

    });

}


async function deleteFolder(id) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this folder?"
        );


    if (!confirmed) {

        return;

    }


    const response =
        await fetch(
            `http://127.0.0.1:8000/special/folders/${id}/`,
            {
                method: "DELETE",

                headers: {
                    "Authorization":
                        `Bearer ${accessToken}`
                }
            }
        );


    if (!response.ok) {

        alert(
            "Failed to delete folder."
        );

        return;

    }


    loadFolders();

}


loadFolders();

</script>

</body>
</html>
