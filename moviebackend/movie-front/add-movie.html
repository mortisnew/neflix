<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Movie</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            color: #222;
        }

        .navbar {
            background: #1f2937;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .back {
            color: white;
            text-decoration: none;
            background: #374151;
            padding: 10px 18px;
            border-radius: 6px;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,.08);
        }

        h1 {
            margin-top: 0;
        }

        h2 {
            margin-top: 40px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        select[multiple] {
            min-height: 130px;
        }

        .people-container,
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .person-row {
            display: grid;
            grid-template-columns: 1fr 200px auto;
            gap: 10px;
            align-items: end;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fafafa;
        }

        .link-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 10px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fafafa;
        }

        .add-btn {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 11px 20px;
            cursor: pointer;
            margin-top: 10px;
        }

        .remove-btn {
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 15px;
            cursor: pointer;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 40px;
        }

        .save {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px 25px;
            cursor: pointer;
        }

        .cancel {
            background: #e5e7eb;
            color: #222;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 6px;
        }

        @media (max-width: 800px) {
            .person-row,
            .link-row {
                grid-template-columns: 1fr;
            }

            .container {
                margin: 20px;
            }
        }
    </style>
</head>

<body>

<div class="navbar">

    <h2>Movie Admin</h2>

    <a href="movie.html" class="back">
        Movies
    </a>

</div>


<div class="container">

    <h1>Add Movie</h1>

    <form id="movieForm">

        <!-- BASIC INFORMATION -->

        <h2>Basic Information</h2>

        <div class="form-group">

            <label for="title">
                Title
            </label>

            <input
                type="text"
                id="title"
                required
            >

        </div>


        <div class="form-group">

            <label for="poster_url">
                Poster URL
            </label>

            <input
                type="url"
                id="poster_url"
                required
            >

        </div>


        <div class="form-group">

            <label for="description">
                Description
            </label>

            <textarea id="description"></textarea>

        </div>


        <div class="form-group">

            <label for="imdb_rating">
                IMDb Rating
            </label>

            <input
                type="number"
                id="imdb_rating"
                min="1"
                max="10"
                step="0.01"
                required
            >

        </div>


        <div class="form-group">

            <label for="duration">
                Duration
            </label>

            <input
                type="number"
                id="duration"
            >

        </div>


        <div class="form-group">

            <label for="release_date">
                Release Date
            </label>

            <input
                type="date"
                id="release_date"
                required
            >

        </div>


        <!-- CATALOG -->

        <h2>Catalog</h2>


        <div class="form-group">

            <label for="genre">
                Genre
            </label>

            <select id="genre" multiple></select>

        </div>


        <div class="form-group">

            <label for="country">
                Country
            </label>

            <select id="country" multiple></select>

        </div>


        <div class="form-group">

            <label for="language">
                Language
            </label>

            <select id="language" multiple></select>

        </div>


        <!-- PEOPLE -->

        <h2>People</h2>

        <div
            id="people-container"
            class="people-container"
        ></div>


        <button
            type="button"
            class="add-btn"
            onclick="addPersonRow()"
        >
            + Add Person
        </button>


        <!-- MOVIE LINKS -->

        <h2>Movie Links</h2>

        <div
            id="links-container"
            class="links-container"
        ></div>


        <button
            type="button"
            class="add-btn"
            onclick="addLinkRow()"
        >
            + Add Movie Link
        </button>


        <!-- ACTIONS -->

        <div class="actions">

            <button
                type="submit"
                class="save"
            >
                Create Movie
            </button>

            <a
                href="movie.html"
                class="cancel"
            >
                Cancel
            </a>

        </div>

    </form>

</div>


<script>

const accessToken =
    localStorage.getItem("access_token");

let allPeople = [];
let allQualities = [];


async function loadOptions(url) {

    const response = await fetch(
        `http://127.0.0.1:8000${url}`,
        {
            headers: {
                "Authorization":
                    `Bearer ${accessToken}`
            }
        }
    );

    if (!response.ok) {

        console.log(
            "Failed to load:",
            url
        );

        return [];

    }

    const data =
        await response.json();

    return Array.isArray(data)
        ? data
        : data.results;

}


/* -------------------------
   LOAD CATALOG
------------------------- */


async function loadCatalog() {

    const genres =
        await loadOptions(
            "/catalog/genres/"
        );

    const genreSelect =
        document.getElementById("genre");

    genres.forEach(item => {

        const option =
            document.createElement("option");

        option.value = item.id;
        option.textContent = item.name;

        genreSelect.appendChild(option);

    });


    const countries =
        await loadOptions(
            "/catalog/countries/"
        );

    const countrySelect =
        document.getElementById("country");

    countries.forEach(item => {

        const option =
            document.createElement("option");

        option.value = item.id;
        option.textContent = item.name;

        countrySelect.appendChild(option);

    });


    const languages =
        await loadOptions(
            "/catalog/languages/"
        );

    const languageSelect =
        document.getElementById("language");

    languages.forEach(item => {

        const option =
            document.createElement("option");

        option.value = item.id;
        option.textContent = item.name;

        languageSelect.appendChild(option);

    });

}


/* -------------------------
   LOAD PEOPLE
------------------------- */


async function loadPeople() {

    allPeople =
        await loadOptions(
            "/people/people/"
        );

}


/* -------------------------
   LOAD QUALITY
------------------------- */


async function loadQualities() {

    allQualities =
        await loadOptions(
            "/catalog/qualities/"
        );

}


/* -------------------------
   ADD PERSON
------------------------- */


function addPersonRow() {

    const container =
        document.getElementById(
            "people-container"
        );

    const row =
        document.createElement("div");

    row.className =
        "person-row";


    let peopleOptions = "";


    allPeople.forEach(person => {

        peopleOptions += `

            <option value="${person.id}">
                ${person.full_name}
            </option>

        `;

    });


    row.innerHTML = `

        <div>

            <label>
                Person
            </label>

            <select class="person-select">

                <option value="">
                    Select Person
                </option>

                ${peopleOptions}

            </select>

        </div>


        <div>

            <label>
                Role
            </label>

            <select class="role-select">

                <option value="">
                    Select Role
                </option>

                <option value="actor">
                    Actor
                </option>

                <option value="director">
                    Director
                </option>

                <option value="writer">
                    Writer
                </option>

            </select>

        </div>


        <button
            type="button"
            class="remove-btn"
            onclick="this.parentElement.remove()"
        >
            Remove
        </button>

    `;


    container.appendChild(row);

}


/* -------------------------
   ADD MOVIE LINK
------------------------- */


function addLinkRow() {

    const container =
        document.getElementById(
            "links-container"
        );

    const row =
        document.createElement("div");

    row.className =
        "link-row";


    let qualityOptions = "";


    allQualities.forEach(quality => {

        qualityOptions += `

            <option value="${quality.id}">
                ${quality.name}
            </option>

        `;

    });


    row.innerHTML = `

        <div>

            <label>
                Quality
            </label>

            <select class="quality-select">

                <option value="">
                    Select Quality
                </option>

                ${qualityOptions}

            </select>

        </div>


        <div>

            <label>
                Encoder
            </label>

            <input
                type="text"
                class="encoder"
            >

        </div>


        <div>

            <label>
                Size MB
            </label>

            <input
                type="number"
                class="size-mb"
            >

        </div>


        <div>

            <label>
                Subtitle
            </label>

            <select class="sub-chose">

                <option value="original">
                    Original
                </option>

                <option value="subtitle">
                    Subtitle
                </option>

                <option value="dubbed">
                    Dubbed
                </option>

            </select>

        </div>


        <div>

            <label>
                URL
            </label>

            <input
                type="url"
                class="link-url"
            >

        </div>


        <div>

            <label>
                Subtitle File
            </label>

            <input
                type="file"
                class="sub-file"
            >

        </div>


        <button
            type="button"
            class="remove-btn"
            onclick="this.parentElement.remove()"
        >
            Remove
        </button>

    `;


    container.appendChild(row);

}


/* -------------------------
   CREATE MOVIE
------------------------- */


document.getElementById(
    "movieForm"
).addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const genre =
            Array.from(
                document.getElementById(
                    "genre"
                ).selectedOptions
            ).map(
                option =>
                    Number(option.value)
            );


        const country =
            Array.from(
                document.getElementById(
                    "country"
                ).selectedOptions
            ).map(
                option =>
                    Number(option.value)
            );


        const language =
            Array.from(
                document.getElementById(
                    "language"
                ).selectedOptions
            ).map(
                option =>
                    Number(option.value)
            );


        const movieData = {

            title:
                document.getElementById(
                    "title"
                ).value,

            poster_url:
                document.getElementById(
                    "poster_url"
                ).value,

            genre: genre,

            country: country,

            language: language,

            description:
                document.getElementById(
                    "description"
                ).value,

            imdb_rating:
                document.getElementById(
                    "imdb_rating"
                ).value,

            duration:
                document.getElementById(
                    "duration"
                ).value || null,

            release_date:
                document.getElementById(
                    "release_date"
                ).value

        };


        /* CREATE MOVIE */


        const movieResponse =
            await fetch(
                "http://127.0.0.1:8000/content/movies/",
                {
                    method: "POST",

                    headers: {
                        "Authorization":
                            `Bearer ${accessToken}`,

                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            movieData
                        )
                }
            );


        if (!movieResponse.ok) {

            const error =
                await movieResponse.json();

            console.log(
                "MOVIE ERROR:",
                error
            );

            alert(
                "Movie error: " +
                JSON.stringify(error)
            );

            return;

        }


        const movie =
            await movieResponse.json();


        const movieId =
            movie.id;


        /* CREATE PEOPLE */


        const peopleRows =
            document.querySelectorAll(
                ".person-row"
            );


        for (const row of peopleRows) {

            const person =
                row.querySelector(
                    ".person-select"
                ).value;


            const roleType =
                row.querySelector(
                    ".role-select"
                ).value;


            if (!person || !roleType) {
                continue;
            }


            const roleData = {

                person:
                    Number(person),

                role_type:
                    roleType,

                movie:
                    Number(movieId)

            };


            const response =
                await fetch(
                    "http://127.0.0.1:8000/content/roles/",
                    {
                        method: "POST",

                        headers: {
                            "Authorization":
                                `Bearer ${accessToken}`,

                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                roleData
                            )
                    }
                );


            if (!response.ok) {

                console.log(
                    "ROLE ERROR:",
                    await response.json()
                );

            }

        }


        /* CREATE MOVIE LINKS */


        const linkRows =
            document.querySelectorAll(
                ".link-row"
            );


        for (const row of linkRows) {

            const quality =
                row.querySelector(
                    ".quality-select"
                ).value;


            const encoder =
                row.querySelector(
                    ".encoder"
                ).value;


            const sizeMb =
                row.querySelector(
                    ".size-mb"
                ).value;


            const subChose =
                row.querySelector(
                    ".sub-chose"
                ).value;


            const url =
                row.querySelector(
                    ".link-url"
                ).value;


            const fileInput =
                row.querySelector(
                    ".sub-file"
                );


            if (
                !quality ||
                !encoder ||
                !sizeMb ||
                !url
            ) {
                continue;
            }


            const formData =
                new FormData();


            formData.append(
                "movie",
                String(movieId)
            );


            formData.append(
                "quality",
                quality
            );


            formData.append(
                "encoder",
                encoder
            );


            formData.append(
                "size_mb",
                sizeMb
            );


            formData.append(
                "sub_chose",
                subChose
            );


            formData.append(
                "url",
                url
            );


            if (
                fileInput.files.length > 0
            ) {

                formData.append(
                    "sub_file",
                    fileInput.files[0]
                );

            }


            const response =
                await fetch(
                    "http://127.0.0.1:8000/content/movie-streams/",
                    {
                        method: "POST",

                        headers: {
                            "Authorization":
                                `Bearer ${accessToken}`
                        },

                        body: formData
                    }
                );


            if (!response.ok) {

                console.log(
                    "LINK ERROR:",
                    await response.json()
                );

            }

        }


        alert(
            "Movie created successfully."
        );


        window.location.href =
            "movie.html";

    }
);


/* -------------------------
   INIT
------------------------- */


async function init() {

    await loadCatalog();

    await loadPeople();

    await loadQualities();

}


init();

</script>

</body>
</html>
